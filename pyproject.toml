[project]
name = "stock-predictor"
version = "0.1.0"
description = "Reproducible free-source daily equity forecasting pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2,<3",
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<0.16",
  "xgboost-cpu>=3.0,<4",
  "catboost>=1.2.8,<2",
  "httpx>=0.28,<0.29",
  "boto3>=1.40,<2",
  "exchange-calendars>=4.11,<5",
  "pandas>=2.3,<4",
  "pyarrow>=21,<25",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
lob = ["torch>=2.10,<3"]

[project.scripts]
stock-predictor = "stock_predictor.cli:main"
stock-predictor-challengers = "stock_predictor_challengers.pipeline:main"
stock-predictor-research = "stock_predictor_research.pipeline:main"
stock-predictor-fundamental-news = "stock_predictor_fundamental_news.pipeline:main"
stock-predictor-lob = "stock_predictor_lob.pipeline:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/stock_predictor", "backend/src/stock_predictor_challengers", "backend/src/stock_predictor_research", "backend/src/stock_predictor_fundamental_news", "backend/src/stock_predictor_lob"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
