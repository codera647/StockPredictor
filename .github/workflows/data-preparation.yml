name: Prepare archived daily dataset

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Existing private extraction manifest key (no credentials)
        required: true
        default: manifests/full-extraction/20261014T163648065170Z.json

permissions:
  contents: read

concurrency:
  group: stock-predictor-data-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install and verify shared implementation
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen
          uv run --frozen ruff check backend
          uv run --frozen pytest -q
      - name: Prepare checksummed archived data
        env:
          DATASET_MANIFEST: ${{ inputs.manifest }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          S3_ENDPOINT_URL: https://br-lingering-shape-b8lz1937.storage.c-14.us-east-1.aws.neon.tech
          S3_REGION: us-east-1
          S3_BUCKET_NAME: stock-predictor-artifacts
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: uv run --frozen stock-predictor prepare --manifest "$DATASET_MANIFEST"
      - name: Attach preparation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dataset-report-${{ github.run_id }}
          path: artifacts/dataset/*.json
          if-no-files-found: ignore
          retention-days: 14
