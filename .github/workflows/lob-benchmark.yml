name: FI-2010 DeepLOB and TransLOB research benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-predictor-fi2010-holdout
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install optional locked CPU dependencies and verify
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen --extra lob
          uv run --frozen --extra lob ruff check backend
          uv run --frozen --extra lob pytest -q
      - name: Restore published frozen report
        env:
          S3_ENDPOINT_URL: https://br-lingering-shape-b8lz1937.storage.c-14.us-east-1.aws.neon.tech
          S3_REGION: us-east-1
          S3_BUCKET_NAME: stock-predictor-artifacts
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: uv run --frozen --extra lob stock-predictor-lob --reuse-completed
      - name: Attach measured research report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fi2010-benchmark-${{ github.run_id }}
          path: artifacts/lob/*.json
          if-no-files-found: ignore
          retention-days: 30
